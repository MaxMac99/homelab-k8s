name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier:
    name: Prettier
    runs-on: homelab-runner
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Node >= 26 links libatomic.so.1, which the actions-runner image lacks
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libatomic1

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bunx prettier --check .
