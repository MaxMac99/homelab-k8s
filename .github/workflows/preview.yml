name: Pulumi Preview

on:
  pull_request:
    branches: [main]

concurrency:
  group: pulumi-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

env:
  PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}

jobs:
  preview:
    name: Pulumi Preview
    runs-on: homelab-runner
    concurrency:
      group: pulumi-preview
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Generate kubeconfig
        run: |
          mkdir -p ~/.kube
          cat <<EOF > ~/.kube/k3s-config
          apiVersion: v1
          kind: Config
          clusters:
            - cluster:
                server: https://kubernetes.default.svc
                certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              name: default
          contexts:
            - context:
                cluster: default
                user: default
              name: default
          current-context: default
          users:
            - name: default
              user:
                tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
          EOF

      # Chart fetches hit 9 remote hosts per run; a single transient network
      # blip used to fail the check and block automerge. One retry covers
      # those (a real change failure fails both attempts and still gates).
      - name: Pulumi Preview (attempt 1)
        id: preview-1
        uses: pulumi/actions@v7
        continue-on-error: true
        with:
          command: preview
          stack-name: default
          comment-on-summary: true

      - name: Pulumi Preview (attempt 2)
        id: preview-2
        if: steps.preview-1.outcome == 'failure'
        uses: pulumi/actions@v7
        continue-on-error: true
        with:
          command: preview
          stack-name: default
          comment-on-summary: true

      - name: Fail if both attempts failed
        if: steps.preview-1.outcome == 'failure' && steps.preview-2.outcome == 'failure'
        run: exit 1
